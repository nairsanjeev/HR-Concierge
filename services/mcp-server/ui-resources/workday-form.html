<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workday Form — HR Concierge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' } } } }
    };
  </script>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e2e8f0; }
    .field-group { border: 1px solid #334155; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; }
    .field-group-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: #8b5cf6; margin-bottom: 0.5rem; }
    input, select, textarea { background: #0f172a; border: 1px solid #334155; border-radius: 0.375rem; padding: 0.5rem 0.75rem; width: 100%; color: #e2e8f0; font-size: 0.875rem; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #8b5cf6; box-shadow: 0 0 0 2px rgba(139,92,246,0.3); }
    label { font-size: 0.8rem; font-weight: 500; color: #94a3b8; display: block; margin-bottom: 0.25rem; }
    .required::after { content: ' *'; color: #f87171; }
    .btn-primary { background: #7c3aed; color: white; padding: 0.625rem 1.25rem; border-radius: 0.5rem; font-weight: 600; border: none; cursor: pointer; width: 100%; }
    .btn-primary:hover { background: #6d28d9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-banner { background: #065f46; border: 1px solid #059669; border-radius: 0.5rem; padding: 1rem; margin-top: 1rem; }
  </style>
</head>
<body class="p-4 max-w-lg mx-auto">
  <div id="app">
    <div class="flex items-center gap-2 mb-4">
      <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
      <h1 class="text-lg font-bold">Workday — Personal Data Update</h1>
    </div>
    <p class="text-sm text-slate-400 mb-4">Complete the form below to submit your changes to Workday.</p>
    <div id="form-container"></div>
    <button id="submit-btn" class="btn-primary mt-4" disabled>Submit to Workday</button>
    <div id="success" class="success-banner hidden">
      <p class="font-semibold text-emerald-300">✓ Changes submitted successfully</p>
      <p class="text-sm text-emerald-200 mt-1" id="success-msg"></p>
    </div>
  </div>

  <script>
    // MCP App communication via postMessage
    const MCP_ORIGIN = '*'; // Host will validate
    let toolInput = null;

    // Listen for tool input from host
    window.addEventListener('message', (event) => {
      try {
        const msg = JSON.parse(typeof event.data === 'string' ? event.data : JSON.stringify(event.data));
        if (msg.method === 'ui/toolInput' || msg.type === 'tool_input') {
          toolInput = msg.params?.input || msg.data;
          renderForm(toolInput);
        }
        if (msg.method === 'ui/initialize') {
          // Respond to init
          window.parent.postMessage(JSON.stringify({
            jsonrpc: '2.0', id: msg.id, result: { capabilities: {} }
          }), MCP_ORIGIN);
        }
      } catch (e) { /* ignore non-MCP messages */ }
    });

    function renderForm(data) {
      const container = document.getElementById('form-container');
      const fields = data?.fields || [];
      const changeTypes = data?.change_types || [];

      if (!fields.length) {
        container.innerHTML = '<p class="text-slate-400">No form fields provided. Awaiting tool input...</p>';
        return;
      }

      // Group fields
      const groups = {};
      fields.forEach(f => {
        const g = f.group || 'General';
        if (!groups[g]) groups[g] = [];
        groups[g].push(f);
      });

      let html = '';
      for (const [groupName, groupFields] of Object.entries(groups)) {
        html += `<div class="field-group"><div class="field-group-label">${groupName}</div>`;
        for (const field of groupFields) {
          const req = field.required ? 'required' : '';
          const reqClass = field.required ? 'required' : '';
          html += `<div class="mb-3"><label class="${reqClass}">${field.label}</label>`;

          if (field.type === 'select' && field.options) {
            html += `<select id="field-${field.id}" ${req}><option value="">Select...</option>`;
            field.options.forEach(o => {
              const label = typeof o === 'string' ? o : o.label;
              const val = typeof o === 'string' ? o : o.value;
              html += `<option value="${val}">${label}</option>`;
            });
            html += `</select>`;
          } else if (field.type === 'textarea') {
            html += `<textarea id="field-${field.id}" rows="3" placeholder="${field.placeholder || ''}" ${req}></textarea>`;
          } else {
            html += `<input id="field-${field.id}" type="${field.type || 'text'}" placeholder="${field.placeholder || ''}" ${req} />`;
          }
          html += `</div>`;
        }
        html += `</div>`;
      }
      container.innerHTML = html;
      document.getElementById('submit-btn').disabled = false;
    }

    // Submit handler
    document.getElementById('submit-btn').addEventListener('click', () => {
      const fields = toolInput?.fields || [];
      const formData = {};
      let valid = true;

      fields.forEach(f => {
        const el = document.getElementById(`field-${f.id}`);
        if (el) {
          formData[f.id] = el.value;
          if (f.required && !el.value) {
            el.style.borderColor = '#f87171';
            valid = false;
          } else {
            el.style.borderColor = '#334155';
          }
        }
      });

      if (!valid) return;

      // Send tool call back to host
      window.parent.postMessage(JSON.stringify({
        jsonrpc: '2.0',
        method: 'tools/call',
        params: {
          name: 'update_workday_employee',
          arguments: {
            employee_id: 'EMP-001234',
            change_type: (toolInput?.change_types || ['address-change'])[0],
            field_data_json: JSON.stringify(formData)
          }
        }
      }), MCP_ORIGIN);

      // Show success
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('submit-btn').textContent = 'Submitted ✓';
      document.getElementById('success').classList.remove('hidden');
      document.getElementById('success-msg').textContent = 'Your changes have been sent to Workday for processing.';
    });

    // If no tool input after 500ms, show placeholder
    setTimeout(() => {
      if (!toolInput) {
        document.getElementById('form-container').innerHTML =
          '<p class="text-slate-400 text-sm">Waiting for form data from the agent...</p>';
      }
    }, 500);
  </script>
</body>
</html>
