<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Report</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', -apple-system, sans-serif; background: #fff; color: #242424; padding: 16px; line-height: 1.5; }
h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; color: #0f6cbd; }
.subtitle { font-size: 13px; color: #616161; margin-bottom: 16px; }
.section { margin-bottom: 16px; padding: 12px; background: #f5f5f5; border-radius: 8px; border: 1px solid #e0e0e0; }
.section-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #242424; }
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12px; font-weight: 500; color: #424242; margin-bottom: 3px; }
.field input, .field select { width: 100%; padding: 8px 10px; border: 1px solid #d1d1d1; border-radius: 4px; font-size: 14px; font-family: inherit; }
.field input:focus, .field select:focus { outline: none; border-color: #0f6cbd; box-shadow: 0 0 0 1px #0f6cbd; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-primary { background: #0f6cbd; color: #fff; }
.btn-primary:hover { background: #0a5199; }
.btn-secondary { background: #f0f0f0; color: #424242; border: 1px solid #d1d1d1; }
.btn-small { padding: 6px 12px; font-size: 12px; }
.actions { display: flex; gap: 8px; margin-top: 16px; }
.status { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 13px; display: none; }
.status.success { display: block; background: #dff6dd; color: #0e700e; border: 1px solid #9ee09e; }
.status.error { display: block; background: #fde7e9; color: #c50f1f; border: 1px solid #f1bbbc; }
.hidden { display: none; }
.add-row { display: grid; grid-template-columns: 1fr 1fr 100px 2fr auto; gap: 8px; align-items: end; margin-bottom: 12px; }
</style>
</head>
<body>
<h2>Expense Report</h2>
<p class="subtitle" id="subtitle">Add your expense line items below.</p>

<form id="form">
  <div id="form-content">
    <div class="section">
      <div class="section-title">Trip / Project</div>
      <div class="field"><label>Trip or Project Name</label><input type="text" name="trip_name" placeholder="e.g. Chicago Client Visit"></div>
    </div>

    <div class="section">
      <div class="section-title">Add Expense Items</div>
      <div class="add-row">
        <div class="field"><label>Date</label><input type="date" name="item_date"></div>
        <div class="field"><label>Category</label>
          <select name="item_category">
            <option value="Meals">Meals</option>
            <option value="Transport">Transport</option>
            <option value="Lodging">Lodging</option>
            <option value="Supplies">Supplies</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field"><label>Amount ($)</label><input type="number" step="0.01" name="item_amount" placeholder="0.00"></div>
        <div class="field"><label>Description</label><input type="text" name="item_description" placeholder="Describe expense"></div>
        <button type="button" class="btn btn-secondary btn-small" id="addItemBtn">+ Add</button>
      </div>
      <div id="items-list"></div>
    </div>

    <div class="actions">
      <button type="submit" class="btn btn-primary">📤 Submit Report</button>
      <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
    </div>
  </div>
</form>

<div id="status" class="status"></div>

<script>
/* __WIDGET_BUNDLE__ */
</script>
</body>
</html>
