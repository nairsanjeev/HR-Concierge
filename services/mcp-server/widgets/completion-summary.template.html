<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workflow Summary</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', -apple-system, sans-serif; background: #fff; color: #242424; padding: 16px; line-height: 1.5; }
h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; color: #0f6cbd; }
.subtitle { font-size: 13px; color: #616161; margin-bottom: 16px; }
.hidden { display: none; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.stat { text-align: center; padding: 12px; background: #f5f5f5; border-radius: 8px; border: 1px solid #e0e0e0; }
.stat-num { font-size: 24px; font-weight: 700; color: #0f6cbd; }
.stat-label { font-size: 11px; color: #616161; margin-top: 2px; }
.stat.completed .stat-num { color: #0e700e; }
.stat.pending .stat-num { color: #c27d07; }
.stat.docs .stat-num { color: #0f6cbd; }
.items-list { border-top: 1px solid #e0e0e0; padding-top: 12px; }
.item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #f0f0f0; }
.item-icon { font-size: 16px; }
.item-label { flex: 1; font-size: 13px; }
.item-status { font-size: 11px; color: #616161; text-transform: capitalize; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-primary { background: #0f6cbd; color: #fff; }
.actions { margin-top: 16px; }
</style>
</head>
<body>
<h2>Workflow Summary</h2>
<p class="subtitle">Actions completed and pending for your request.</p>

<div id="summary-content" class="hidden"></div>

<div class="actions">
  <button class="btn btn-primary" id="doneBtn">✓ Done</button>
</div>

<script>
/* __WIDGET_BUNDLE__ */
</script>
</body>
</html>
